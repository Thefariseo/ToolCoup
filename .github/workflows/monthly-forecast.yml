# Monthly issue: refresh every source, refit, archive the forecast in the public registry, score the
# issues whose window has closed, and push. Vercel redeploys from the push.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ACLED_EMAIL, ACLED_PASSWORD   a myACLED account with API access to events
# Raw ACLED data is downloaded fresh on every run and never cached or committed: only monthly
# counts per country leave the runner.
name: Monthly forecast

on:
  schedule:
    - cron: "17 5 6 * *"   # the 6th of each month, 05:17 UTC: the previous month is complete in ACLED by then
  workflow_dispatch:
    inputs:
      boot:
        description: Bootstrap refits for the uncertainty intervals (0 = skip)
        default: "20"

permissions:
  contents: write

concurrency:
  group: monthly-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r pipeline/requirements.txt

      - name: Registry must be intact before anything is written
        run: python pipeline/registry.py --check

      - name: Coup sources
        run: |
          python pipeline/fetch_coups.py
          python pipeline/fetch_coup_sources.py
      - name: Structural covariates (V-Dem, World Bank)
        run: python pipeline/fetch_structural.py
      - name: ACLED events
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
        run: python pipeline/fetch_acled.py < /dev/null
      - name: Coup database
        run: python pipeline/build_coupdb.py
      - name: Extension sources (military, FAO prices, ethnic exclusion, leaders, UN sanctions, peacekeeping, term limits, sovereign stress)
        run: python pipeline/fetch_extensions.py
      - name: News tone (GDELT raw files, one day in seven, incremental)
        run: python pipeline/fetch_gdelt.py --workers 3
      - name: Model, validation, export
        run: python pipeline/run.py --boot "${{ inputs.boot || '20' }}"
      - name: Political-violence outlook (one LightGBM for all horizons, blended with persistence; 24-origin backtest)
        run: python pipeline/cast.py
      - name: Protests and riots outlook (the same model with protests and riots as the target; 12-origin backtest, one origin every 4 periods)
        run: python pipeline/cast.py --kind unrest --origins 12 --stride 4
      - name: Unrest probabilities (protest wave and violence escalation, next three months)
        run: python pipeline/unrest.py
      - name: Term structure of the coup probability (for markets that close on other dates)
        run: python pipeline/terms.py
      - name: Structural analogs
        run: python pipeline/analogs.py
      - name: Standing and context (descriptive facts for each country page)
        run: python pipeline/standing.py
      - name: Registry still intact after the run
        run: python pipeline/registry.py --check

      - name: The site must build with the new data
        run: |
          npm ci
          npm run build

      # The hybrid reading: model, prediction markets and an analyst pooled, filed in registry/hybrid/ and scored once windows close. Needs the repository
      # secret OPENAI_API_KEY for the analyst; without it the snapshot holds the model and the markets only. A failure here never blocks the month.
      - name: Hybrid snapshot and scoring
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HYBRID_SNAPSHOT: "1"
        run: |
          npx next start -p 3100 > next.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 60); do curl -sf http://localhost:3100/metodo > /dev/null && break; sleep 2; done
          node scripts/hybrid-snapshot.mjs http://localhost:3100 --top 40 || echo "No hybrid snapshot this month"
          kill "$SERVER" 2>/dev/null || true
          pkill -f "next start" || true
          python pipeline/hybrid_score.py
        continue-on-error: true

      - name: Publish
        run: |
          git config user.name "praevex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webdata data/coupdb data/gdelt registry
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Issue $(python -c "import json;print(json.load(open('webdata/summary.json'))['meta']['forecast_from'])"): monthly forecast and registry update"
          git push
