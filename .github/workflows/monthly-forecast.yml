# Monthly issue: refresh every source, refit, archive the forecast in the public registry, score the
# issues whose window has closed, and push. Vercel redeploys from the push.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ACLED_EMAIL, ACLED_PASSWORD   a myACLED account with API access to events
# Raw ACLED data is downloaded fresh on every run and never cached or committed: only monthly
# counts per country leave the runner.
name: Monthly forecast

on:
  schedule:
    - cron: "17 5 6 * *"   # the 6th of each month, 05:17 UTC: the previous month is complete in ACLED by then
  workflow_dispatch:
    inputs:
      boot:
        description: Bootstrap refits for the uncertainty intervals (0 = skip)
        default: "20"

permissions:
  contents: write

concurrency:
  group: monthly-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r pipeline/requirements.txt

      - name: Registry must be intact before anything is written
        run: python pipeline/registry.py --check

      - name: Coup sources
        run: |
          python pipeline/fetch_coups.py
          python pipeline/fetch_coup_sources.py
      - name: Structural covariates (V-Dem, World Bank)
        run: python pipeline/fetch_structural.py
      - name: ACLED events
        env:
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
        run: python pipeline/fetch_acled.py < /dev/null
      - name: Coup database
        run: python pipeline/build_coupdb.py
      - name: Model, validation, export
        run: python pipeline/run.py --boot "${{ inputs.boot || '20' }}"
      - name: Registry still intact after the run
        run: python pipeline/registry.py --check

      - name: The site must build with the new data
        run: |
          npm ci
          npm run build

      - name: Publish
        run: |
          git config user.name "toolcoup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webdata data/coupdb registry
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Issue $(python -c "import json;print(json.load(open('webdata/summary.json'))['meta']['forecast_from'])"): monthly forecast and registry update"
          git push
